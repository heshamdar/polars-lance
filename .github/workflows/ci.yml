name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.10"
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: just lint-workflows

      - name: Lint Rust
        run: just lint-rust

      - name: Lint Python
        run: just lint-pyth

      - name: Lint the conformance suite
        run: just lint-conformance

  test-rust:
    name: Rust tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install protoc
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-protoc-windows

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Rust tests
        run: just test-rust

  # The conformance suite is a standalone package with its own tests: the generator's determinism
  # and prefix-stability properties, the reference harnesses, and the mutation check that every
  # deliberately-broken harness is caught by some case. None of it needs the extension, so it runs
  # before the long builds.
  test-conformance-self:
    name: Conformance suite (self-tests)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run the conformance suite's own tests
        run: just test-conformance-self

  test-python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: test-rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install protoc
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-protoc-windows

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Python integration tests
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            just test
          else
            just test-no-docker
          fi

  # Lance guards parts of its 2.1 encoder with `debug_assert!`s that a nullable nested column can
  # trip (lance-format/lance#8032, #8033). The jobs above build debug, so they cannot exercise
  # that data; this one builds what a released wheel is, where those tests run for real.
  test-python-release:
    name: Python tests (release build)
    needs: test-rust
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Python tests against a release build
        run: just test-release

      # The readable output of a conformance run: every check, the declared limits, and the spec
      # that reproduces each failure. Built even when the tests failed, since that is exactly
      # when it is worth reading.
      - name: Build the conformance report
        if: always()
        run: just conformance-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: reports/
