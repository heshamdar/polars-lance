[package]
name = "polars-lance"
version = "0.5.0"
edition = "2021"
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
pyo3 = ["dep:pyo3", "dep:pyo3-polars"]

[dependencies]
arrow = { version = "58.4.0", features = ["ffi"] }
futures = "0.3"
# For `LanceFileVersion`, which `lance` takes in `WriteParams` but does not re-export. Already
# in the tree as a dependency of `lance`; kept at the same version, which they release together.
lance-file = { version = "9.0.0", default-features = false }
once_cell = "1.20"
polars = { version = "0.54.4", default-features = false, features = ["lazy"] }
polars-core = { version = "0.54.4", default-features = false }
pyo3 = { version = "0.28.3", features = ["abi3-py310"], optional = true }
pyo3-polars = { version = "0.27.0", features = ["lazy", "dtype-full"], optional = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

# Lance's `protoc` feature fails building on Windows, and requires a preinstalled `protoc` binary instead.
[target.'cfg(windows)'.dependencies]
lance = { version = "9.0.0", default-features = false, features = ["aws", "azure", "gcp"] }

[target.'cfg(not(windows))'.dependencies]
lance = { version = "9.0.0", default-features = false, features = ["aws", "azure", "gcp", "protoc"] }

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"
