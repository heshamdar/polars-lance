[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-io-conformance"
description = "A generative conformance suite for Polars IO plugins"
version = "0.1.0"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
  # The generator is built from expressions whose semantics are version-sensitive; see
  # `docs/api-findings.md` for the three APIs it leans on. The floor is the Polars that
  # first has all three, not a guess.
  "polars>=1.40",
  "hypothesis>=6.100",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "mypy>=1.20.2", "ruff>=0.15.12", "pyarrow>=14.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/plioc"]

[tool.hatch.build.targets.wheel.force-include]
"src/plioc/py.typed" = "plioc/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: cases whose data is large enough to matter (1 MiB strings, wide schemas)",
]

[tool.mypy]
files = ["src/plioc", "tests"]
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
